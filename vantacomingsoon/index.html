<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTA SCANNER | Yakında...</title>
    <!-- Futuristic Google Fonts matching VANTA SCANNER typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Orbitron', sans-serif;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Main Fullscreen Wrapper */
        .viewport-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #000000;
        }

        /* Fullscreen Background Banner Layer */
        .banner-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: url('vanta_banner_sade.png');
            background-position: center 44%;
            background-repeat: no-repeat;
            background-size: contain;
            z-index: 1;
            filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.08));
            animation: subtleFloat 7s ease-in-out infinite;
        }

        /* For ultra-wide or standard desktop screens, scale gracefully to fill screen */
        @media (min-aspect-ratio: 16/10) {
            .banner-bg {
                background-size: cover;
                background-position: center center;
            }
        }

        /* Subtle Radial Vignette & Ambient Metallic Glow */
        .ambient-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 45%, rgba(0, 0, 0, 0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Bottom Coming Soon ("Yakında...") Container */
        .coming-soon-wrapper {
            position: absolute;
            bottom: 11%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            padding: 0 20px;
        }

        /* Glowing Futuristic Text */
        .yakinda-text {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.25rem, 2.5vw, 2.2rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.45em;
            padding-left: 0.45em; /* Optical centering for wide letter-spacing */
            color: #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #d4d4d8 60%, #71717a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 
                0 0 15px rgba(255, 255, 255, 0.45),
                0 0 35px rgba(255, 255, 255, 0.2);
            animation: pulseGlow 3.5s ease-in-out infinite;
        }

        /* Animated Dots */
        .dots::after {
            content: '...';
            display: inline-block;
            width: 1.8em;
            text-align: left;
            animation: dotSteps 2.4s infinite steps(4, end);
        }

        /* Sleek Silver Scanner Line Underneath */
        .scanner-line-track {
            width: clamp(160px, 24vw, 320px);
            height: 2px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
        }

        .scanner-line-beam {
            position: absolute;
            top: 0;
            left: -50%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
            box-shadow: 0 0 15px #ffffff;
            animation: scanBeam 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* Keyframe Animations */
        @keyframes pulseGlow {
            0%, 100% {
                opacity: 0.85;
                filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.35));
            }
            50% {
                opacity: 1;
                filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.75));
            }
        }

        @keyframes scanBeam {
            0% {
                left: -50%;
            }
            100% {
                left: 100%;
            }
        }

        @keyframes subtleFloat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.018);
            }
        }

        @media (max-width: 640px) {
            .banner-bg {
                background-position: center 42%;
                background-size: 95% auto;
            }
            .coming-soon-wrapper {
                bottom: 14%;
            }
            .yakinda-text {
                letter-spacing: 0.3em;
                padding-left: 0.3em;
            }
        }
    </style>
</head>
<body>

    <main class="viewport-container">
        <!-- Full-screen Vanta Scanner Banner -->
        <div class="banner-bg" role="img" aria-label="Vanta Scanner Logo"></div>

        <!-- Subtle Vignette Overlay -->
        <div class="ambient-overlay"></div>

        <!-- "Yakında..." Status Section -->
        <div class="coming-soon-wrapper">
            <h1 class="yakinda-text">Yakında<span class="dots"></span></h1>
            <div class="scanner-line-track">
                <div class="scanner-line-beam"></div>
            </div>
        </div>
    </main>

</body>
</html>
